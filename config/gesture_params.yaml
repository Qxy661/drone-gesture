# ==========================================
# Gesture Recognition System Parameters
# ==========================================

gesture_recognizer:
  ros__parameters:
    video_source: 0
    model_complexity: 1
    min_detection_confidence: 0.7
    min_tracking_confidence: 0.5
    publish_annotated_video: true
    max_num_hands: 1

gesture_commander:
  ros__parameters:
    takeoff_altitude: 1.0
    forward_velocity: 0.5
    forward_duration: 2.0
    gesture_debounce_time: 1.5
    test_mode: true

safety_monitor:
  ros__parameters:
    battery_warning_pct: 30.0
    battery_critical_pct: 15.0
    heartbeat_timeout_sec: 10.0
    connection_timeout_sec: 5.0
    auto_land_on_critical: true

gesture_velocity_controller:
  ros__parameters:
    max_velocity: 1.0          # 最大速度 (m/s)
    velocity_sensitivity: 2.0  # 速度放大系数
    smoothing_alpha: 0.3       # 低通滤波系数 (越小越平滑)
    dead_zone: 0.005           # 死区阈值 (消除手抖)
    test_mode: true
